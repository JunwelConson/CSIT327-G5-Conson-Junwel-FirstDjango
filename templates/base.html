
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}CampusConnect{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
                CampusConnect
            </a>

            <div class="navbar-nav ms-auto d-flex flex-row align-items-center gap-3">

                {% if user.is_authenticated %}

                    <span class="text-white">
                        Hi, {{ user.username }}!
                    </span>

                    <a href="{% url 'profile' %}"
                       class="nav-link text-white">
                        My Profile
                    </a>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit"
                                class="btn btn-outline-light btn-sm">
                            Log out
                        </button>
                    </form>

                {% else %}

                    <a href="{% url 'login' %}"
                       class="nav-link text-white">
                        Log in
                    </a>

                    <a href="{% url 'signup' %}"
                       class="btn btn-light btn-sm text-primary fw-semibold">
                        Sign up
                    </a>

                {% endif %}

            </div>
        </div>
    </nav>

    <!-- Success and Notification Messages -->
    <div class="container mt-3">

        {% if messages %}
            {% for message in messages %}

                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
                     role="alert">

                    {{ message }}

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Close">
                    </button>

                </div>

            {% endfor %}
        {% endif %}

    </div>

    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
